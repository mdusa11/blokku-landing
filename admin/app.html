<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Blokku HQ</title>
<style>
:root{--tx:#1f2937;--mut:#6b7280;--ln:#e5e7eb;--sf:#f9fafb;--ac:#2563EB;--acl:#eff6ff;--red:#DC2626;--amb:#D97706;--grn:#16A34A}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:#fff}
body{margin:0;background:#fff;color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--ln)}
.hd{max-width:960px;margin:0 auto;padding:12px 20px 0}
.top{display:flex;gap:12px;align-items:center;position:relative}
.top img{width:28px;height:28px;border-radius:6px;flex:none}
.ttl{flex:1;min-width:0}
h1{font-size:17px;font-weight:600;margin:0;line-height:1.2}
#stat{font-size:12px;color:var(--mut);line-height:1.3}#stat.warn{color:var(--amb)}
#stat button{padding:0 0 0 4px;font-size:12px;color:var(--ac);border:0;background:none;text-decoration:underline}
#menu{display:none;position:absolute;right:0;top:36px;background:#fff;border:1px solid var(--ln);border-radius:8px;box-shadow:0 4px 16px #0000001a;padding:4px;z-index:30;min-width:150px}
#menu button{display:block;width:100%;text-align:left;border:0;padding:9px 12px}
nav{display:flex;gap:2px;overflow-x:auto;margin:6px -8px 0;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:10px 12px;color:var(--mut);font-size:15px;font-weight:500;background:none}
nav button:hover{background:none;color:var(--tx)}
nav button.on{background:none;border-color:transparent;border-bottom-color:var(--ac);color:var(--ac)}
main{max-width:960px;margin:0 auto;padding:28px 20px 80px}
button{font:inherit;font-size:14px;color:var(--tx);background:#fff;border:1px solid var(--ln);border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover{background:var(--sf)}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}button.pri:hover{background:#1d4ed8}
button.dng{color:var(--red);border-color:#fecaca}button.dng:hover{background:#fef2f2}
button.ghost{border-color:transparent;background:none;color:var(--mut)}button.ghost:hover{background:var(--sf)}
button.sm{padding:4px 10px;font-size:13px}
button.on{background:var(--acl);border-color:#bfdbfe;color:var(--ac)}
input,select,textarea{font:inherit;font-size:15px;color:var(--tx);background:#fff;border:1px solid #d1d5db;border-radius:6px;padding:8px 10px;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #bfdbfe;border-color:var(--ac)}
textarea{width:100%;min-height:90px;resize:vertical}
h2{margin:0 0 4px;font-size:26px;font-weight:600;letter-spacing:-.01em}
h3{margin:0;font-size:16px;font-weight:600}
.sub{color:var(--mut);margin:0 0 8px;font-size:15px}
.mut{color:var(--mut);font-size:13px}
.sp{flex:1}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
.head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}.head>div{flex:1;min-width:200px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.sh{display:flex;align-items:baseline;gap:10px;margin:40px 0 6px;flex-wrap:wrap}.sh h3{flex:0 1 auto}.sh .mut{flex:1}
.sh:first-of-type{margin-top:24px}
.two{display:grid;gap:0 48px;grid-template-columns:minmax(0,1fr)}
@media(min-width:780px){.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* estados */
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;background:var(--c,#9ca3af);flex:none}
.e-publicada,.e-hecho,.e-en-la-app{--c:var(--grn)}
.e-en-revisión,.e-estreno-programado{--c:var(--amb)}
.e-lista,.e-programado,.e-en-desarrollo{--c:var(--ac)}
.e-idea{--c:#d1d5db}
/* listas */
.list{border-top:1px solid var(--ln)}
.li{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}
.li.clk{cursor:pointer}.li.clk:hover{background:var(--sf)}
.li .t{flex:1;min-width:0}.li .t b{display:block;font-weight:500;overflow-wrap:anywhere}.li .t .mut{display:block}
.li .r{flex:none;text-align:right;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.li .dc{flex:none;width:44px;text-align:center;line-height:1.1}.li .dc b{display:block;font-size:20px;font-weight:600}.li .dc span{font-size:12px;color:var(--mut)}
.li .lb{flex:none;width:110px;font-size:13px;color:var(--mut)}
.empty{padding:18px 0;color:var(--mut);font-size:14px}
.tk{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--ln)}
.tk input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--ac)}
.tk .t{flex:1;cursor:pointer;min-width:0;overflow-wrap:anywhere}.tk .t b{display:block;font-weight:500}.tk .t .mut{display:block}
.blk{color:var(--amb);font-size:13px;display:block}
.note{border-left:3px solid var(--amb);padding:8px 14px;margin:0 0 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.note span{flex:1;min-width:200px;font-size:14px}
/* miniaturas */
.th{background:#f3f4f6;display:grid;place-items:center;overflow:hidden;color:#9ca3af;font-weight:600;font-size:15px;width:40px;height:40px;border-radius:6px;flex:none}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.ph:after{content:attr(data-l)}
/* versiones */
.ver{padding:28px 0;border-top:1px solid var(--ln)}.ver:first-of-type{border-top:0;padding-top:8px}
.vh{display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap}.vh .n{font-size:26px;font-weight:600;margin-right:2px}
.ver h4{margin:20px 0 4px;font-size:13px;font-weight:600;color:var(--mut)}
ul.cn{margin:4px 0;padding-left:20px}ul.cn li{margin:3px 0}
.ck{display:flex;gap:10px;align-items:flex-start;margin:6px 0;cursor:pointer;font-size:15px}.ck input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--ac)}.ck.d span{text-decoration:line-through;color:var(--mut)}
.pbar{height:4px;border-radius:4px;background:var(--ln);overflow:hidden;margin:6px 0 10px}.pbar i{display:block;height:100%;background:var(--grn)}
.shots{display:flex;gap:10px;overflow-x:auto;padding:4px 0 10px}
.shots img{height:150px;width:auto;border-radius:6px;flex:none;cursor:pointer;border:1px solid var(--ln);background:#f3f4f6}
.shots figure{margin:0;flex:none}.shots figcaption{font-size:11px;color:var(--mut);max-width:110px;margin-top:3px}
/* calendario */
.calw{display:grid;gap:28px;grid-template-columns:minmax(0,1fr)}
@media(min-width:820px){.calw{grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:48px}}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal .dw{text-align:center;font-size:12px;color:var(--mut);padding:4px 0}
.cell{min-height:56px;border-radius:8px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.cell:hover{background:var(--sf)}
.cell .d{font-size:15px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.cell.out{opacity:.35}.cell.today .d{background:var(--ac);color:#fff;font-weight:600}.cell.sel{background:#f3f4f6}
.dots{display:flex;gap:3px;min-height:6px}.dt{width:6px;height:6px;border-radius:50%;background:var(--ac)}.dt.idea{background:#fff;border:1.5px solid #9ca3af}
.calh{display:flex;align-items:center;gap:8px;margin-bottom:10px}.calh h3{flex:1;text-transform:capitalize;font-size:18px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--mut);margin:0 0 10px}.legend span{display:flex;align-items:center;gap:6px}
#tl{overflow-x:auto;border:1px solid var(--ln);border-radius:8px}
#tlin{position:relative}
.mon{position:absolute;top:0;bottom:0;border-left:1px solid var(--ln);padding:4px 6px;font-size:12px;color:var(--mut);white-space:nowrap}.mon.y{border-left-color:#9ca3af;color:var(--tx);font-weight:600}
.tlr{position:absolute;left:0;height:36px;cursor:pointer}.tlr:hover{background:var(--sf)}
.tlb{position:absolute;top:10px;height:16px;border-radius:4px;background:var(--ac)}.tlb.pt{border-radius:50%;width:16px!important}.tlb.idea{background:#d1d5db}.tlb.est{background:#93c5fd}
.tll{position:absolute;top:8px;font-size:13px;white-space:nowrap}.tll small{color:var(--mut);margin-left:6px}
#hoy{position:absolute;top:0;bottom:0;width:1px;background:var(--red);z-index:5}#hoy:before{content:"hoy";position:absolute;top:22px;left:4px;font-size:11px;color:var(--red);background:#fff;padding:0 3px}
/* premios */
.filt{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 6px}.filt select{flex:1 1 150px;min-width:0}.filt input:not([type=checkbox]){flex:2 1 160px;min-width:0}.filt .ck{white-space:nowrap}
.rr{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}.rr i{width:8px;height:8px;border-radius:50%;background:var(--rc)}
.route{display:flex;gap:14px;overflow-x:auto;padding:8px 0 12px}.rs{flex:none;width:64px;text-align:center;cursor:pointer}.rs .th{width:56px;height:56px;margin:0 auto 4px}.rs b{display:block;font-size:12px;font-weight:600}.rs span{font-size:11px;color:var(--mut);display:block;line-height:1.2}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--ln)}th{font-size:12px;color:var(--mut);font-weight:600}
/* cupones */
.code{font-family:ui-monospace,Menlo,monospace;font-size:15px;font-weight:600;background:#f3f4f6;padding:3px 8px;border-radius:6px;user-select:all}
.li.col{flex-direction:column;align-items:stretch;gap:6px}.li.col .row{margin:0}
.thr{display:flex;gap:6px}.thr .th{width:32px;height:32px;cursor:pointer}
/* modal */
#ov{display:none;position:fixed;inset:0;background:#00000066;z-index:50;overflow-y:auto}
#md{max-width:600px;margin:6vh auto 0;background:#fff;border-radius:12px 12px 0 0;padding:22px 20px;min-height:94vh}
@media(min-width:700px){#md{border-radius:12px;min-height:0;margin-bottom:6vh}}
#md h3{font-size:22px;margin:0 0 12px}.f{margin-bottom:14px}.f label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}.f input:not([type=checkbox]),.f select{width:100%}
.ml{max-height:170px;overflow:auto;border:1px solid #d1d5db;border-radius:6px;padding:6px}.ml label{display:flex;gap:8px;color:var(--tx);font-size:14px;margin:0;padding:3px}
.bigimg{width:100%;max-height:420px;object-fit:contain;border-radius:8px;display:block;background:#f3f4f6;cursor:zoom-in}
.gal{display:flex;gap:8px;overflow-x:auto;margin:10px 0}.gal img{height:80px;border-radius:6px;cursor:pointer}
.kv{margin:14px 0}.kv b{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-bottom:2px}
#lb{display:none;position:fixed;inset:0;background:#000d;z-index:70;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:10px}#lb img{max-width:96vw;max-height:88vh;border-radius:8px}#lb span{color:#d1d5db;font-size:13px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:8px;z-index:80;display:none;max-width:90vw;font-size:14px}
@media(max-width:640px){
 .hd{padding:10px 14px 0}main{padding:20px 14px 80px}h2{font-size:23px}
 .li .lb{width:84px}.li{gap:10px}
}
</style></head><body>
<header><div class="hd"><div class="top"><img id="lg" alt=""><div class="ttl"><h1>Blokku</h1><div id="stat"></div></div>
<button class="sm ghost" data-act="menu">Más ▾</button>
<div id="menu"><button data-act="export">Exportar respaldo</button><button data-act="import">Importar respaldo</button><button data-act="logout">Salir</button></div>
<input type="file" id="file" accept="application/json" hidden><input type="file" id="imgin" accept="image/*" hidden></div>
<nav id="nav"></nav></div></header>
<main><div id="app"></div></main>
<div id="ov"><div id="md"></div></div><div id="lb"></div><div id="toast"></div>
<script>
/*INJECT*/
(function(){
'use strict';
var LS='blokku_admin_doc';
var S={doc:null,tab:'hoy',pf:{tipo:'Todos',rar:'Todas',gana:'Todas',q:''},pv:'cosm',cal:{y:0,m:0,sel:'',view:'mes',zoom:6},pq:'Todos',sheet:null,imgT:null,open:{},cl:{mode:'local',rev:0,at:0,state:'ok',why:''},cq:'',csolo:false,reveal:{}};
var TABS=[['hoy','Hoy'],['cal','Calendario'],['ver','Versiones'],['prem','Premios'],['cup','Cupones'],['pend','Pendientes'],['ideas','Ideas']];
var MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var RAR=['Común','Raro','Épico','Legendario','Mítico'];
var RC={'Común':'#9ca3af','Raro':'#2563EB','Épico':'#7c3aed','Legendario':'#d97706','Mítico':'#db2777'};
var RMAP={common:'Común',comun:'Común',rare:'Raro',raro:'Raro',rara:'Raro',epic:'Épico',epico:'Épico',epica:'Épico',legendary:'Legendario',legendario:'Legendario',legendaria:'Legendario',mythic:'Mítico',mitico:'Mítico',mitica:'Mítico'};
var GANA={logro:'Logro',nivel:'Ruta de nivel',reto:'Reto difícil',evento:'Evento',código:'Código de sticker'};
var TT={version:'Versión',evento:'Evento',temporada:'Temporada',estreno:'Estreno de premios',hito:'Hito'};
var CEST=['disponible','publicado','regalado'];
var IMGC={},IMGP={};
var BLANK='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function toast(m){var t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none'},3200)}
function dn(s){var p=s.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2])/864e5}
function iso(n){return new Date(n*864e5).toISOString().slice(0,10)}
function todayS(){var d=new Date();return iso(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)}
function fd(s){if(!s)return '';var p=s.split('-');return +p[2]+' '+MES[+p[1]-1].slice(0,3)+' '+p[0]}
function rango(a,b){return b&&b!==a?fd(a)+' – '+fd(b):fd(a)}
function rel(s){var d=dn(s)-dn(todayS());return d===0?'hoy':d===1?'mañana':d>1?'en '+d+' días':d===-1?'ayer':'hace '+(-d)+' días'}
function ecl(s){return 'e-'+String(s).replace(/\s+/g,'-')}
function find(sec,id){return (S.doc[sec]||[]).find(function(x){return x.id===id})}
function prem(id){return find('premios',id)}
function grp(t){t=t||'';if(/tema/i.test(t))return 'Tema';if(/estilo|pieza/i.test(t))return 'Estilo';if(/marco/i.test(t))return 'Marco';if(/efecto/i.test(t))return 'Efecto';return 'Otro'}
function ago(t){var s=Math.max(0,(Date.now()-t)/1000);if(s<60)return 'hace unos segundos';if(s<3600)return 'hace '+Math.round(s/60)+' min';if(s<86400)return 'hace '+Math.round(s/3600)+' h';return 'hace '+Math.round(s/86400)+' d'}

/* ---------- datos: localStorage + nube (KV) ---------- */
function fillSeed(){
  Object.keys(SEED_DOC).forEach(function(k){if(S.doc[k]===undefined&&Array.isArray(SEED_DOC[k]))S.doc[k]=clone(SEED_DOC[k])});
  if(!S.doc.codigos||typeof S.doc.codigos!=='object')S.doc.codigos={};
}
function load(){
  var d=null;try{d=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){}
  S.fresh=!d;
  S.doc=d||clone(SEED_DOC);
  fillSeed();
  var n=new Date();S.cal.y=n.getFullYear();S.cal.m=n.getMonth();S.cal.sel=todayS();
  try{var t=localStorage.getItem('bk_tab');if(t&&TABS.some(function(x){return x[0]===t}))S.tab=t}catch(e){}
}
function size(){try{return JSON.stringify(S.doc).length}catch(e){return 0}}
function save(){
  S.doc.version=(S.doc.version||1)+1;
  var ok=true;
  try{localStorage.setItem(LS,JSON.stringify(S.doc));S.fresh=false}
  catch(e){if(S.cl.mode!=='cloud'){toast('El almacenamiento del navegador está lleno (~5 MB). Exporta un respaldo y quita imágenes agregadas.');return false}}
  schedule();
  return ok;
}
function commit(){save();render()}
function needsUpdate(){return (S.doc.seedRev||1)<(SEED_DOC.seedRev||1)}
function mergeSeed(){
  var d=S.doc,borr=d.borrados||[];
  Object.keys(SEED_DOC).forEach(function(sec){
    var sv=SEED_DOC[sec];if(!Array.isArray(sv))return;
    var list=d[sec]=d[sec]||[];
    sv.forEach(function(si){
      if(borr.indexOf(si.id)>=0)return;
      var u=list.find(function(x){return x.id===si.id});
      if(!u){list.push(clone(si));return}
      Object.keys(si).forEach(function(f){if(f==='_forzar')return;if(u[f]===undefined)u[f]=clone(si[f])});
      (si._forzar||[]).forEach(function(f){u[f]=clone(si[f])});
      if(Array.isArray(si.checklist)){u.checklist=u.checklist||[];si.checklist.forEach(function(c){if(!u.checklist.some(function(x){return x.t===c.t}))u.checklist.push(clone(c))})}
    });
  });
  d.seedRev=SEED_DOC.seedRev;d.actualizado=SEED_DOC.actualizado;
  save();render();toast('Datos actualizados. Tus notas se conservaron.');
}
function delItem(sec,id){S.doc[sec]=S.doc[sec].filter(function(x){return x.id!==id});(S.doc.borrados=S.doc.borrados||[]).push(id)}

var pushT=null,pushing=false,dirty=false;
function key(){try{return sessionStorage.getItem('bk_k')||''}catch(e){return ''}}
function api(path,o){
  o=o||{};var h={'Authorization':'Bearer '+key()};
  if(o.body!=null)h['Content-Type']=o.ct||'application/json';
  return fetch('/api/admin/'+path,{method:o.method||'GET',headers:h,body:o.body,cache:'no-store'});
}
function adopt(j){
  S.cl.rev=j.rev;S.cl.at=j.updated;S.doc=j.doc;fillSeed();S.fresh=false;
  try{localStorage.setItem(LS,JSON.stringify(S.doc))}catch(e){}
}
async function cloudInit(){
  try{
    var r=await api('doc');
    if(r.status===503||r.status===401||r.status===429){S.cl.mode='local';S.cl.why=String(r.status);paintStat();return}
    if(!r.ok)throw new Error(r.status);
    var j=await r.json();
    S.cl.mode='cloud';S.cl.state='ok';
    if(!j.doc){S.cl.rev=j.rev||0;await push()}
    else adopt(j);
  }catch(e){S.cl.mode='local';S.cl.why='net'}
  render();
}
function schedule(){
  if(S.cl.mode!=='cloud')return;
  dirty=true;S.cl.state='pending';clearTimeout(pushT);pushT=setTimeout(push,1200);paintStat();
}
async function migrateImgs(){
  for(var sec in S.doc){
    var L=S.doc[sec];if(!Array.isArray(L))continue;
    for(var a=0;a<L.length;a++){
      var it=L[a];if(!it||!Array.isArray(it.imgs))continue;
      for(var i=0;i<it.imgs.length;i++){
        var u=it.imgs[i];if(typeof u!=='string'||u.indexOf('data:')!==0)continue;
        var id=uid(),r=await api('img/'+id,{method:'PUT',body:u,ct:'text/plain'});
        if(r.status===413||r.status===400)continue;
        if(!r.ok)throw new Error(r.status);
        IMGC['img:'+id]=u;it.imgs[i]='img:'+id;
      }
    }
  }
}
async function push(){
  if(pushing){clearTimeout(pushT);pushT=setTimeout(push,600);return}
  pushing=true;dirty=false;S.cl.state='saving';paintStat();
  try{
    await migrateImgs();
    var r=await api('doc',{method:'PUT',body:JSON.stringify({baseVersion:S.cl.rev,doc:S.doc})});
    if(r.status===409){var c=await r.json();pushing=false;conflict(c);return}
    if(!r.ok)throw new Error(r.status);
    var j=await r.json();S.cl.rev=j.rev;S.cl.at=j.updated;S.cl.state=dirty?'pending':'ok';
    try{localStorage.setItem(LS,JSON.stringify(S.doc))}catch(e){}
  }catch(e){S.cl.state='err';dirty=true;clearTimeout(pushT);pushT=setTimeout(push,8000)}

function iu(r){

  return BLANK;
}
function pimg(p,big){
  if(p.imgs&&p.imgs.length)return iu(p.imgs[0]);

}

function addImage(sec,id){S.imgT={sec:sec,id:id};$('#imgin').value='';$('#imgin').click()}
function onImg(f){
  if(!f||!S.imgT)return;
  var tgt=S.imgT,fr=new FileReader();
  fr.onload=function(){
    var im=new Image();
    im.onload=async function(){
      var cloud=S.cl.mode==='cloud',w=Math.min(cloud?1000:520,im.width),q=.82,lim=cloud?400*1024:150*1024,u;
      for(;;){
        var h=Math.round(im.height*w/im.width),c=document.createElement('canvas');c.width=w;c.height=h;
        var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
        u=c.toDataURL('image/jpeg',q);
        if(u.length<=lim||w<=240)break;
        if(q>.5)q-=.1;else w=Math.round(w*.8);
      }
      var it=find(tgt.sec,tgt.id);if(!it)return;
      var ref=u;
      if(cloud){
        var id=uid();
        try{var r=await api('img/'+id,{method:'PUT',body:u,ct:'text/plain'});if(!r.ok)throw 0;ref='img:'+id;IMGC[ref]=u}
        catch(e){toast('No se pudo subir la imagen');return}
      }
      (it.imgs=it.imgs||[]).push(ref);
      if(!save()){it.imgs.pop()}else toast('Imagen agregada ('+Math.round(u.length/1024)+' KB)');
      render();
    };
    im.onerror=function(){toast('No se pudo leer esa imagen')};
    im.src=fr.result;
  };
  fr.readAsDataURL(f);
}

var DIAS=['L','M','M','J','V','S','D'];
function vCal(){

function calMes(){
  var C=S.cal,first=Date.UTC(C.y,C.m,1)/864e5,off=(new Date(first*864e5).getUTCDay()+6)%7,dim=new Date(Date.UTC(C.y,C.m+1,0)).getUTCDate();

  for(var i=0;i<weeks*7;i++){

function calLinea(){
  var L=S.doc.timeline.slice().sort(function(a,b){return dn(a.inicio)-dn(b.inicio)});
  if(!L.length)return '<div class="empty">Sin eventos</div>';
  var pd=S.cal.zoom,min=Math.min.apply(null,L.map(function(x){return dn(x.inicio)}))-10,t=dn(todayS());min=Math.min(min,t-10);
  var max=Math.max.apply(null,L.map(function(x){return dn(x.fin||x.inicio)}));
  var W=(max-min)*pd+320,H=40+L.length*36;
  var h='<div class="bar"><span class="mut">Acercar</span><button class="sm" data-act="zoom" data-d="-1">−</button><button class="sm" data-act="zoom" data-d="1">+</button><span class="mut">Desliza hacia los lados. La línea roja es hoy.</span></div>';
  h+='<div id="tl"><div id="tlin" style="width:'+W+'px;height:'+H+'px">';
  var d=new Date(min*864e5),y=d.getUTCFullYear(),m=d.getUTCMonth();m++;if(m>11){m=0;y++}
  while(true){
    var n=Date.UTC(y,m,1)/864e5;if(n>max+30)break;
    h+='<div class="mon'+(m===0?' y':'')+'" style="left:'+(n-min)*pd+'px">'+MES[m].slice(0,3)+(m===0||m===d.getUTCMonth()?' '+y:'')+'</div>';
    m++;if(m>11){m=0;y++}
  }
  L.forEach(function(x,i){

document.addEventListener('click',function(ev){
  if(!ev.target.closest('[data-act="menu"]')&&$('#menu').style.display==='block')$('#menu').style.display='none';
  if(ev.target.id==='ov'){closeMd();return}
  if(ev.target.closest('#lb')){$('#lb').style.display='none';return}
  var el=ev.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,d=el.dataset;
  if(a==='tgk'||a==='tgc'||a==='pfs'||a==='cest'||a==='cnote'||a==='csolo')return; /* se manejan en change */
  switch(a){
    case 'menu':{var m=$('#menu');m.style.display=m.style.display==='block'?'none':'block';break}
    case 'hist':showHist();break;
    case 'restore':restore(d.rev);break;
    case 'goto':if(d.q)S.pq=d.q;goto(d.t);break;
    case 'close':closeMd();render();break;
    case 'export':exportDoc();break;
    case 'import':$('#file').value='';$('#file').click();break;
    case 'logout':sessionStorage.removeItem('bk_k');location.reload();break;
    case 'merge':mergeSeed();break;
    case 'cview':S.cal.view=d.v;render();break;
    case 'cmv':{var n=Number(d.d);if(!n){var t=new Date();S.cal.y=t.getFullYear();S.cal.m=t.getMonth();S.cal.sel=todayS()}else{S.cal.m+=n;if(S.cal.m<0){S.cal.m=11;S.cal.y--}if(S.cal.m>11){S.cal.m=0;S.cal.y++}}render();break}
    case 'day':S.cal.sel=d.d;{var dt=new Date(dn(d.d)*864e5);S.cal.y=dt.getUTCFullYear();S.cal.m=dt.getUTCMonth()}render();break;
    case 'zoom':{var e=$('#tl');S.keepScroll=e?e.scrollLeft:null;S.cal.zoom=Math.max(2,Math.min(16,S.cal.zoom+Number(d.d)*2));render();break}
    case 'tl':sheet('timeline',d.id);break;
    case 'prem':if(prem(d.id))sheet('premios',d.id);break;
    case 'pv':S.pv=d.v;render();break;
    case 'pq':S.pq=d.v;render();break;
    case 'tgdone':S.open.done=!S.open.done;render();break;
    case 'add':edit(d.sec,null,d.ini?{inicio:d.ini}:null);break;
    case 'edit':{var it=find(d.sec,d.id);if(it){if(S.sheet)S.sheet.sc=$('#ov').scrollTop;edit(d.sec,it)}break}
    case 'pend':edit('pendientes',find('pendientes',d.id));break;
    case 'vote':{var i=find('ideas',d.id);i.votos=(i.votos||0)+1;commit();break}
    case 'copy':try{navigator.clipboard.writeText(d.t);toast('Copiado: '+d.t)}catch(e){toast(d.t)}break;
    case 'cgrp':S.open['c_'+d.id]=!S.open['c_'+d.id];render();break;
    case 'creveal':S.reveal[d.h]=!S.reveal[d.h];render();break;
    case 'ccopy':{var cc=CODES.find(function(c){return c.h===d.h});try{navigator.clipboard.writeText(cc.c);toast('Código copiado')}catch(e){toast('No se pudo copiar; usa «ver»')}break}
    case 'addimg':addImage(d.sec,d.id);break;
    case 'rmimg':{if(confirm('¿Quitar esta imagen?')){var it2=find(d.sec,d.id);it2.imgs.splice(Number(d.i),1);commit()}break}
    case 'lbk':if(d.u){var q=d.u.split('|');lightbox(iu(find(q[0],q[1]).imgs[q[2]]),d.l)}else if(IMGS[d.k])lightbox(IMGS[d.k],d.l);break;
    case 'lb':{var q2=d.u.split('|');lightbox(iu(find(q2[0],q2[1]).imgs[q2[2]]),'');break}
    case 'addck':{var v=find('versiones',d.id),t2=prompt('Nuevo punto de la checklist');if(t2&&t2.trim()){(v.checklist=v.checklist||[]).push({t:t2.trim(),d:false});commit()}break}
  }
});
document.addEventListener('change',function(ev){
  var el=ev.target.closest('[data-act]');
  if(el){
    var a=el.dataset.act;
    if(a==='tgk'){var k=find('pendientes',el.dataset.id);k.col=el.checked?'hecho':'todo';commit()}
    if(a==='tgc'){var v=find('versiones',el.dataset.id);v.checklist[Number(el.dataset.i)].d=el.checked;commit()}
    if(a==='pfs'){S.pf[el.dataset.k]=el.value;render()}
    if(a==='cest')setCode(el.dataset.h,'e',el.value);
    if(a==='cnote')setCode(el.dataset.h,'n',el.value.trim());
    if(a==='csolo'){S.csolo=el.checked;render()}
  }
  if(ev.target.id==='file'){
    var f=ev.target.files[0];if(!f)return;
    var fr=new FileReader();fr.onload=function(){
      try{var j=JSON.parse(fr.result);if(!j||!Array.isArray(j.timeline))throw 0;
        if(!confirm('Esto reemplaza los datos guardados por los del archivo. ¿Seguir?'))return;
        S.doc=j;fillSeed();commit();toast('Importado')}
      catch(e){toast('Ese archivo no es un respaldo del panel')}
    };fr.readAsText(f);
  }
  if(ev.target.id==='imgin')onImg(ev.target.files[0]);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){$('#lb').style.display='none';closeMd();render()}});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&S.cl.mode==='cloud'&&$('#ov').style.display!=='block')refresh()});
window.addEventListener('error',function(e){var t=$('#toast');if(t){t.textContent='Error: '+e.message;t.style.display='block'}});
setInterval(paintStat,30000);
if(IMGS.icono)$('#lg').src=IMGS.icono;
load();render();cloudInit();
})();
</script></body></html>
