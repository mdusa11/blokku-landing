# Sitio de Blokku (blokku.online) en Cloudflare.
# Vite compila a ./dist con `npm run build`; aquí solo se declara qué carpeta
# publicar, para no depender de los campos del panel.
name = "blokku"
compatibility_date = "2026-09-01"
# Worker para /play y /p (enlace corto de los QR) y el panel privado /admin;
# lo demás son assets.
main = "worker.js"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/play", "/play/", "/p", "/p/", "/admin", "/admin/", "/api/admin/*"]

# Guardado en la nube del panel /admin (API en worker.js). Pasos: Cloudflare >
# Storage & Databases > KV > Create, nombre `blokku-admin`; pegar su ID abajo,
# descomentar y desplegar. Sin el binding la API responde 503 {error:'sin_kv'}
# y el panel guarda solo en el navegador (localStorage).
# [[kv_namespaces]]
# binding = "ADMIN_KV"
# id = "PENDIENTE_ID"
