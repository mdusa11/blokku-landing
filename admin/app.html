<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Blokku HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--tx:#1f2937;--mut:#6b7280;--ln:#e5e7eb;--sf:#f9fafb;--ac:#2563EB;--acl:#eff6ff;--red:#DC2626;--amb:#D97706;--grn:#16A34A}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:#fff}
body{margin:0;background:#fff;color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--ln)}
.hd{max-width:960px;margin:0 auto;padding:12px 20px 0}
.top{display:flex;gap:12px;align-items:center;position:relative}
.top img{width:28px;height:28px;border-radius:6px;flex:none}
.ttl{flex:1;min-width:0}
h1{font-size:17px;font-weight:600;margin:0;line-height:1.2}
#stat{font-size:12px;color:var(--mut);line-height:1.3}#stat.warn{color:var(--amb)}
#stat button{padding:0 0 0 4px;font-size:12px;color:var(--ac);border:0;background:none;text-decoration:underline}
#menu{display:none;position:absolute;right:0;top:36px;background:#fff;border:1px solid var(--ln);border-radius:8px;box-shadow:0 4px 16px #0000001a;padding:4px;z-index:30;min-width:150px}
#menu button{display:block;width:100%;text-align:left;border:0;padding:9px 12px}
nav{display:flex;gap:2px;overflow-x:auto;margin:6px -8px 0;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:10px 12px;color:var(--mut);font-size:15px;font-weight:500;background:none}
nav button:hover{background:none;color:var(--tx)}
nav button.on{background:none;border-color:transparent;border-bottom-color:var(--ac);color:var(--ac)}
main{max-width:960px;margin:0 auto;padding:28px 20px 80px}
button{font:inherit;font-size:14px;color:var(--tx);background:#fff;border:1px solid var(--ln);border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover{background:var(--sf)}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}button.pri:hover{background:#1d4ed8}
button.dng{color:var(--red);border-color:#fecaca}button.dng:hover{background:#fef2f2}
button.ghost{border-color:transparent;background:none;color:var(--mut)}button.ghost:hover{background:var(--sf)}
button.sm{padding:4px 10px;font-size:13px}
button.on{background:var(--acl);border-color:#bfdbfe;color:var(--ac)}
input,select,textarea{font:inherit;font-size:15px;color:var(--tx);background:#fff;border:1px solid #d1d5db;border-radius:6px;padding:8px 10px;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #bfdbfe;border-color:var(--ac)}
textarea{width:100%;min-height:90px;resize:vertical}
h2{margin:0 0 4px;font-size:26px;font-weight:600;letter-spacing:-.01em}
h3{margin:0;font-size:16px;font-weight:600}
.sub{color:var(--mut);margin:0 0 8px;font-size:15px}
.mut{color:var(--mut);font-size:13px}
.sp{flex:1}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
.head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}.head>div{flex:1;min-width:200px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.sh{display:flex;align-items:baseline;gap:10px;margin:40px 0 6px;flex-wrap:wrap}.sh h3{flex:0 1 auto}.sh .mut{flex:1}
.sh:first-of-type{margin-top:24px}
.two{display:grid;gap:0 48px;grid-template-columns:minmax(0,1fr)}
@media(min-width:780px){.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* estados */
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;background:var(--c,#9ca3af);flex:none}
.e-publicada,.e-hecho,.e-en-la-app{--c:var(--grn)}
.e-en-revisión,.e-estreno-programado{--c:var(--amb)}
.e-lista,.e-programado,.e-en-desarrollo{--c:var(--ac)}
.e-idea{--c:#d1d5db}
/* listas */
.list{border-top:1px solid var(--ln)}
.li{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}
.li.clk{cursor:pointer}.li.clk:hover{background:var(--sf)}
.li .t{flex:1;min-width:0}.li .t b{display:block;font-weight:500;overflow-wrap:anywhere}.li .t .mut{display:block}
.li .r{flex:none;text-align:right;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.li .dc{flex:none;width:44px;text-align:center;line-height:1.1}.li .dc b{display:block;font-size:20px;font-weight:600}.li .dc span{font-size:12px;color:var(--mut)}
.li .lb{flex:none;width:110px;font-size:13px;color:var(--mut)}
.empty{padding:18px 0;color:var(--mut);font-size:14px}
.tk{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--ln)}
.tk input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--ac)}
.tk .t{flex:1;cursor:pointer;min-width:0;overflow-wrap:anywhere}.tk .t b{display:block;font-weight:500}.tk .t .mut{display:block}
.blk{color:var(--amb);font-size:13px;display:block}
.note{border-left:3px solid var(--amb);padding:8px 14px;margin:0 0 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.note span{flex:1;min-width:200px;font-size:14px}
/* miniaturas */
.th{background:#f3f4f6;display:grid;place-items:center;overflow:hidden;color:#9ca3af;font-weight:600;font-size:15px;width:40px;height:40px;border-radius:6px;flex:none}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.ph:after{content:attr(data-l)}
/* versiones */
.ver{padding:28px 0;border-top:1px solid var(--ln)}.ver:first-of-type{border-top:0;padding-top:8px}
.vh{display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap}.vh .n{font-size:26px;font-weight:600;margin-right:2px}
.ver h4{margin:20px 0 4px;font-size:13px;font-weight:600;color:var(--mut)}
ul.cn{margin:4px 0;padding-left:20px}ul.cn li{margin:3px 0}
.ck{display:flex;gap:10px;align-items:flex-start;margin:6px 0;cursor:pointer;font-size:15px}.ck input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--ac)}.ck.d span{text-decoration:line-through;color:var(--mut)}
.pbar{height:4px;border-radius:4px;background:var(--ln);overflow:hidden;margin:6px 0 10px}.pbar i{display:block;height:100%;background:var(--grn)}
.shots{display:flex;gap:10px;overflow-x:auto;padding:4px 0 10px}
.shots img{height:150px;width:auto;border-radius:6px;flex:none;cursor:pointer;border:1px solid var(--ln);background:#f3f4f6}
.shots figure{margin:0;flex:none}.shots figcaption{font-size:11px;color:var(--mut);max-width:110px;margin-top:3px}
/* calendario */
.calw{display:grid;gap:28px;grid-template-columns:minmax(0,1fr)}
@media(min-width:820px){.calw{grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:48px}}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal .dw{text-align:center;font-size:12px;color:var(--mut);padding:4px 0}
.cell{min-height:56px;border-radius:8px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
.cell:hover{background:var(--sf)}
.cell .d{font-size:15px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.cell.out{opacity:.35}.cell.today .d{background:var(--ac);color:#fff;font-weight:600}.cell.sel{background:#f3f4f6}
.dots{display:flex;gap:3px;min-height:6px}.dt{width:6px;height:6px;border-radius:50%;background:var(--ac)}.dt.idea{background:#fff;border:1.5px solid #9ca3af}
.calh{display:flex;align-items:center;gap:8px;margin-bottom:10px}.calh h3{flex:1;text-transform:capitalize;font-size:18px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--mut);margin:0 0 10px}.legend span{display:flex;align-items:center;gap:6px}
#tl{overflow-x:auto;border:1px solid var(--ln);border-radius:8px}
#tlin{position:relative}
.mon{position:absolute;top:0;bottom:0;border-left:1px solid var(--ln);padding:4px 6px;font-size:12px;color:var(--mut);white-space:nowrap}.mon.y{border-left-color:#9ca3af;color:var(--tx);font-weight:600}
.tlr{position:absolute;left:0;height:36px;cursor:pointer}.tlr:hover{background:var(--sf)}
.tlb{position:absolute;top:10px;height:16px;border-radius:4px;background:var(--ac)}.tlb.pt{border-radius:50%;width:16px!important}.tlb.idea{background:#d1d5db}.tlb.est{background:#93c5fd}
.tll{position:absolute;top:8px;font-size:13px;white-space:nowrap}.tll small{color:var(--mut);margin-left:6px}
#hoy{position:absolute;top:0;bottom:0;width:1px;background:var(--red);z-index:5}#hoy:before{content:"hoy";position:absolute;top:22px;left:4px;font-size:11px;color:var(--red);background:#fff;padding:0 3px}
/* premios */
.filt{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 6px}.filt select{flex:1 1 150px;min-width:0}.filt input:not([type=checkbox]){flex:2 1 160px;min-width:0}.filt .ck{white-space:nowrap}
.rr{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}.rr i{width:8px;height:8px;border-radius:50%;background:var(--rc)}
.route{display:flex;gap:14px;overflow-x:auto;padding:8px 0 12px}.rs{flex:none;width:64px;text-align:center;cursor:pointer}.rs .th{width:56px;height:56px;margin:0 auto 4px}.rs b{display:block;font-size:12px;font-weight:600}.rs span{font-size:11px;color:var(--mut);display:block;line-height:1.2}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--ln)}th{font-size:12px;color:var(--mut);font-weight:600}
/* cupones */
.code{font-family:ui-monospace,Menlo,monospace;font-size:15px;font-weight:600;background:#f3f4f6;padding:3px 8px;border-radius:6px;user-select:all}
.li.col{flex-direction:column;align-items:stretch;gap:6px}.li.col .row{margin:0}
.thr{display:flex;gap:6px}.thr .th{width:32px;height:32px;cursor:pointer}
/* modal */
#ov{display:none;position:fixed;inset:0;background:#00000066;z-index:50;overflow-y:auto}
#md{max-width:600px;margin:6vh auto 0;background:#fff;border-radius:12px 12px 0 0;padding:22px 20px;min-height:94vh}
@media(min-width:700px){#md{border-radius:12px;min-height:0;margin-bottom:6vh}}
#md h3{font-size:22px;margin:0 0 12px}.f{margin-bottom:14px}.f label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}.f input:not([type=checkbox]),.f select{width:100%}
.ml{max-height:170px;overflow:auto;border:1px solid #d1d5db;border-radius:6px;padding:6px}.ml label{display:flex;gap:8px;color:var(--tx);font-size:14px;margin:0;padding:3px}
.bigimg{width:100%;max-height:420px;object-fit:contain;border-radius:8px;display:block;background:#f3f4f6;cursor:zoom-in}
.gal{display:flex;gap:8px;overflow-x:auto;margin:10px 0}.gal img{height:80px;border-radius:6px;cursor:pointer}
.kv{margin:14px 0}.kv b{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-bottom:2px}
#lb{display:none;position:fixed;inset:0;background:#000d;z-index:70;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:10px}#lb img{max-width:96vw;max-height:88vh;border-radius:8px}#lb span{color:#d1d5db;font-size:13px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:8px;z-index:80;display:none;max-width:90vw;font-size:14px}
@media(max-width:640px){
 .hd{padding:10px 14px 0}main{padding:20px 14px 80px}h2{font-size:23px}
 .li .lb{width:84px}.li{gap:10px}
}

/* ===== diseño 2026-10 ===== */
:root{--tx:#0f172a;--mut:#64748b;--ln:#e8eaf1;--sf:#f6f7fb;--ac:#5b4cf0;--acl:#efedff;--card:#fff;--sh:0 1px 2px #0f172a0d,0 4px 16px #0f172a0a}
html,body{background:var(--sf)}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased}
header{background:#ffffffeb;backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--ln)}
.hd{padding:14px 20px 10px}
.top img{width:38px;height:38px;border-radius:10px;box-shadow:0 2px 8px #5b4cf033}
h1{font-size:18px;font-weight:800;letter-spacing:-.02em}
h1:after{content:" HQ";background:linear-gradient(90deg,#5b4cf0,#e64aa0);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{gap:6px;margin:12px 0 0;padding-bottom:2px}
nav button{border:0;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;color:var(--mut)}
nav button:hover{background:var(--sf);color:var(--tx)}
nav button.on{background:var(--tx);color:#fff;border:0}
main{padding:32px 20px 96px}
h2{font-size:30px;font-weight:800;letter-spacing:-.03em}
h3{font-weight:700;letter-spacing:-.01em}
.sub{font-size:15px}
.sh{margin:44px 0 12px}
.sh h3{font-size:17px}
button{border-radius:10px;font-weight:500;border-color:var(--ln);transition:background .15s,border-color .15s,transform .1s}
button:active{transform:scale(.97)}
button.pri{background:linear-gradient(135deg,#5b4cf0,#7a5cff);border:0;box-shadow:0 2px 10px #5b4cf040;font-weight:600}
button.pri:hover{background:linear-gradient(135deg,#4c3de0,#6a4cf0)}
button.on{background:var(--acl);border-color:#d9d4ff;color:var(--ac);font-weight:600}
.bar button{border-radius:999px;padding:7px 16px}
input,select,textarea{border-radius:10px;border-color:var(--ln);background:#fff}
input:focus,select:focus,textarea:focus{outline:3px solid #5b4cf026;border-color:var(--ac)}
.filt select,.filt input{height:42px}
/* tarjetas */
.list{background:var(--card);border:1px solid var(--ln);border-radius:16px;box-shadow:var(--sh);overflow:hidden}
.li{padding:12px 16px;border-bottom:1px solid var(--ln)}
.list>.li:last-child,.list>.tk:last-child{border-bottom:0}
.li.clk:hover{background:#fafaff}
.li .t b{font-weight:600}
.tk{padding:12px 16px}
.empty{padding:22px 16px;text-align:center}
.th{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#eef0f7,#e2e5f0);color:#94a3b8;box-shadow:inset 0 0 0 1px #0f172a0d}
/* chips */
.rr{padding:3px 10px;border-radius:999px;font-weight:600;font-size:12px;color:color-mix(in srgb,var(--rc) 80%,#000);background:color-mix(in srgb,var(--rc) 13%,#fff)}
.rr i{width:6px;height:6px}
.st{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;background:#f1f3f8}
.code{background:#f1f0ff;color:#3b2fc0;border-radius:8px}
.note{background:#fffbeb;border:1px solid #fde68a;border-left:4px solid #f59e0b;border-radius:12px;padding:12px 16px}
/* rutas y tablas */
.route{gap:10px;padding:6px 2px 14px}
.rs{width:92px;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px 6px;box-shadow:var(--sh);transition:transform .15s}
.rs:hover{transform:translateY(-2px)}
.rs .th{width:56px;height:56px}
.rs b{font-size:13px;margin-top:2px}
.tbl{background:var(--card);border:1px solid var(--ln);border-radius:16px;box-shadow:var(--sh)}
th{background:#fafbfe;text-transform:uppercase;letter-spacing:.04em;font-size:11px}
th,td{padding:12px 14px}
tr:last-child td{border-bottom:0}
td b{font-weight:600}
/* versiones y calendario */
.ver{background:var(--card);border:1px solid var(--ln);border-radius:16px;box-shadow:var(--sh);padding:22px 22px;margin-bottom:16px}.ver:first-of-type{padding-top:22px}
.pbar{height:6px}.pbar i{background:linear-gradient(90deg,#22c55e,#16a34a)}
.cal{gap:4px}.cell{border-radius:12px}.cell.today .d{background:var(--ac)}.cell.sel{background:var(--acl)}
.dt{background:var(--ac)}
#tl{background:var(--card);border-radius:16px;box-shadow:var(--sh)}
.tlb{background:linear-gradient(90deg,#5b4cf0,#8b5cf6)}
/* modal */
#ov{background:#0f172a80;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#md{border-radius:20px 20px 0 0;padding:26px 24px}
@media(min-width:700px){#md{border-radius:20px;box-shadow:0 24px 64px #0f172a40}}
.bigimg{border-radius:14px}
#toast{border-radius:12px;box-shadow:0 8px 24px #0f172a40}
@media(max-width:640px){.hd{padding:12px 16px 8px}main{padding:22px 16px 90px}h2{font-size:25px}.li{padding:12px 14px}.ver{padding:18px 16px}}
/* ===== plan, códigos, en vivo ===== */
.pvt div .bt{display:inline-block;opacity:1}
nav{-webkit-overflow-scrolling:touch}
.e-activo{--c:var(--grn)}.e-agotado{--c:var(--amb)}.e-caducado{--c:#9ca3af}.e-desactivado,.e-inactivo{--c:var(--red)}.e-próximo{--c:var(--ac)}.e-terminado{--c:#9ca3af}.e-remoto{--c:#8b5cf6}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;box-shadow:var(--sh);padding:18px;margin:0 0 14px}
.card h4{margin:0 0 4px;font-size:15px;font-weight:700}
.filt+.stats{margin-top:16px}.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin:0 0 18px}
.stat{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;box-shadow:var(--sh)}
.stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2}.stat span{font-size:12px;color:var(--mut)}
.g2{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.f input[type=number],.f input[type=text]{min-width:0}
.f input:disabled{background:var(--sf);color:var(--mut)}
.f .hint{font-size:12px;color:var(--mut);margin-top:3px}
.route.wrap{flex-wrap:wrap;overflow:visible}
.rs b{overflow-wrap:anywhere}
.tws{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.tws .th{width:34px;height:34px;border-radius:9px;font-size:13px}
.tws .tn{font-size:12px;color:var(--mut)}
/* selector de premios */
.pkc{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.chp{display:inline-flex;align-items:center;gap:6px;background:var(--acl);color:#3b2fc0;border-radius:999px;padding:3px 6px 3px 10px;font-size:12px;font-weight:600;cursor:pointer}
.chp:hover{background:#e3dfff}.chp u{text-decoration:none;font-size:15px;line-height:1;opacity:.6}
.pk{max-height:220px;overflow:auto;border:1px solid var(--ln);border-radius:12px;margin-top:8px;background:#fff}
.pkr{display:flex;gap:10px;align-items:center;padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--ln)}.pkr:last-child{border-bottom:0}
.pkr:hover{background:#fafaff}.pkr.on{background:var(--acl)}
.pkr .th{width:32px;height:32px;border-radius:8px;font-size:12px}
.pkr .t{flex:1;min-width:0;font-size:14px}.pkr .t span{display:block;font-size:12px;color:var(--mut)}
.pkr .ck2{width:18px;height:18px;border-radius:5px;border:1.5px solid #cbd5e1;flex:none;display:grid;place-items:center;font-size:12px;color:#fff}.pkr.on .ck2{background:var(--ac);border-color:var(--ac)}.pkr.on .ck2:after{content:"✓"}
/* línea de niveles */
.stp{display:grid;grid-template-columns:84px 22px minmax(0,1fr);gap:0 10px}
.stp .lv{text-align:right;padding-top:14px}.stp .lv b{display:block;font-size:15px;font-weight:700;line-height:1.2}.stp .lv span{font-size:11px;color:var(--mut)}
.stp .rail{position:relative}.stp .rail:before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--ln)}
.stp .rail i{position:absolute;left:3px;top:17px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--ac);z-index:1}
.stp.fin .rail i{border-color:var(--grn)}.stp.ini .rail i{border-color:#94a3b8}
.stp .cds{display:grid;gap:8px;padding:6px 0}
.stp.gp .gx{font-size:12px;color:var(--mut);padding:6px 0}

/* logros */

.chipx.v{background:#f1edff;color:#6d28d9}.chipx.a{background:#ecfdf5;color:#047857}

/* previews */
.pvt{border-radius:16px;padding:14px;color:#fff;background:linear-gradient(135deg,#5b4cf0,#e64aa0);display:flex;gap:12px;align-items:center;width:100%;max-width:340px;box-shadow:0 6px 18px #5b4cf033}
.pvt .th{background:#ffffff33;box-shadow:none;color:#fff;width:54px;height:54px}.pvt img.pi{width:54px;height:54px;border-radius:12px;object-fit:cover;flex:none;background:#ffffff33}
.pvt div b{display:block;font-size:15px;line-height:1.25}.pvt div span{font-size:12px;opacity:.92;display:block;margin-top:2px}
.bt{display:inline-block;margin-top:8px;background:#fff;color:#3b2fc0;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700}

.pvd b{display:block;font-size:16px}.pvd span{font-size:12px;opacity:.8;display:block;margin-top:2px}
.pvd .cc{font-family:ui-monospace,Menlo,monospace;background:#ffffff1f;border-radius:10px;padding:8px;margin:10px 0;font-weight:700;letter-spacing:.04em;font-size:14px}
.pvd .bt{display:block;margin:0;background:linear-gradient(135deg,#5b4cf0,#7a5cff);color:#fff;padding:8px}
.av{display:flex;gap:16px 20px;flex-wrap:wrap;align-items:flex-start}
.av .in{flex:1 1 260px;min-width:0}.av .pv{flex:0 1 340px;min-width:0}
.big{font-size:22px;font-weight:800;letter-spacing:-.02em}
@media(max-width:640px){.stp{grid-template-columns:62px 20px minmax(0,1fr);gap:0 6px}.card{padding:14px}}
</style></head><body>
<header><div class="hd"><div class="top"><img id="lg" alt=""><div class="ttl"><h1>Blokku</h1><div id="stat"></div></div>
<button class="sm ghost" data-act="menu">Más ▾</button>
<div id="menu"><button data-act="export">Exportar respaldo</button><button data-act="import">Importar respaldo</button><button data-act="logout">Salir</button></div>
<input type="file" id="file" accept="application/json" hidden><input type="file" id="imgin" accept="image/*" hidden></div>
<nav id="nav"></nav></div></header>
<main><div id="app"></div></main>
<div id="ov"><div id="md"></div></div><div id="lb"></div><div id="toast"></div>
<script>
/*INJECT*/
(function(){
'use strict';
var LS='blokku_admin_doc';
var S={doc:null,tab:'hoy',pf:{tipo:'Todos',rar:'Todas',gana:'Todas',q:''},pv:'cosm',cal:{y:0,m:0,sel:'',view:'mes',zoom:6},pq:'Todos',sheet:null,imgT:null,open:{},cl:{mode:'local',rev:0,at:0,state:'ok',why:''},cq:'',csolo:false,reveal:{}};
var TABS=[['hoy','Hoy'],['cal','Calendario'],['ver','Versiones'],['prem','Premios'],['plan','Plan'],['cup','Cupones'],['cod','Códigos'],['live','En vivo'],['pend','Pendientes'],['ideas','Ideas']];
var MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var RAR=['Común','Raro','Épico','Legendario','Mítico'];
var RC={'Común':'#9ca3af','Raro':'#2563EB','Épico':'#7c3aed','Legendario':'#d97706','Mítico':'#db2777'};
var RMAP={common:'Común',comun:'Común',rare:'Raro',raro:'Raro',rara:'Raro',epic:'Épico',epico:'Épico',epica:'Épico',legendary:'Legendario',legendario:'Legendario',legendaria:'Legendario',mythic:'Mítico',mitico:'Mítico',mitica:'Mítico'};
var GANA={inicio:'Gratis desde el inicio',logro:'Logro',nivel:'Ruta de nivel',reto:'Reto difícil',evento:'Evento',dusa:'Colección Dusa',código:'Solo código'};
var TT={version:'Versión',evento:'Evento',temporada:'Temporada',estreno:'Estreno de premios',hito:'Hito'};
var CEST=['disponible','publicado','regalado'];
var IMGC={},IMGP={};
var BLANK='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function toast(m){var t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none'},3200)}
function dn(s){var p=s.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2])/864e5}
function iso(n){return new Date(n*864e5).toISOString().slice(0,10)}
function todayS(){var d=new Date();return iso(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)}
function fd(s){if(!s)return '';var p=s.split('-');return +p[2]+' '+MES[+p[1]-1].slice(0,3)+' '+p[0]}
function rango(a,b){return b&&b!==a?fd(a)+' – '+fd(b):fd(a)}
function rel(s){var d=dn(s)-dn(todayS());return d===0?'hoy':d===1?'mañana':d>1?'en '+d+' días':d===-1?'ayer':'hace '+(-d)+' días'}
function ecl(s){return 'e-'+String(s).replace(/\s+/g,'-')}
function find(sec,id){return (S.doc[sec]||[]).find(function(x){return x.id===id})}
function prem(id){return find('premios',id)}
function grp(t){t=t||'';if(/tema/i.test(t))return 'Tema';if(/estilo|pieza/i.test(t))return 'Estilo';if(/marco/i.test(t))return 'Marco';if(/efecto/i.test(t))return 'Efecto';return 'Otro'}
function ago(t){var s=Math.max(0,(Date.now()-t)/1000);if(s<60)return 'hace unos segundos';if(s<3600)return 'hace '+Math.round(s/60)+' min';if(s<86400)return 'hace '+Math.round(s/3600)+' h';return 'hace '+Math.round(s/86400)+' d'}

/* ---------- datos: localStorage + nube (KV) ---------- */
function fillSeed(){
  Object.keys(SEED_DOC).forEach(function(k){if(S.doc[k]===undefined&&Array.isArray(SEED_DOC[k]))S.doc[k]=clone(SEED_DOC[k])});
  if(!S.doc.codigos||typeof S.doc.codigos!=='object')S.doc.codigos={};
}
function load(){
  var d=null;try{d=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){}
  S.fresh=!d;
  S.doc=d||clone(SEED_DOC);
  fillSeed();
  var n=new Date();S.cal.y=n.getFullYear();S.cal.m=n.getMonth();S.cal.sel=todayS();
  try{var t=localStorage.getItem('bk_tab');if(t&&TABS.some(function(x){return x[0]===t}))S.tab=t}catch(e){}
}
function size(){try{return JSON.stringify(S.doc).length}catch(e){return 0}}
function save(){
  S.doc.version=(S.doc.version||1)+1;
  var ok=true;
  try{localStorage.setItem(LS,JSON.stringify(S.doc));S.fresh=false}
  catch(e){if(S.cl.mode!=='cloud'){toast('El almacenamiento del navegador está lleno (~5 MB). Exporta un respaldo y quita imágenes agregadas.');return false}}
  schedule();
  return ok;
}
function commit(){save();render()}
function needsUpdate(){return (S.doc.seedRev||1)<(SEED_DOC.seedRev||1)}
function mergeSeed(quiet){
  var d=S.doc,borr=d.borrados||[];
  Object.keys(SEED_DOC).forEach(function(sec){
    var sv=SEED_DOC[sec];if(!Array.isArray(sv))return;
    var list=d[sec]=d[sec]||[];
    sv.forEach(function(si){
      if(borr.indexOf(si.id)>=0)return;
      var u=list.find(function(x){return x.id===si.id});
      if(!u){list.push(clone(si));return}
      Object.keys(si).forEach(function(f){if(f==='_forzar')return;if(u[f]===undefined)u[f]=clone(si[f])});
      (si._forzar||[]).forEach(function(f){u[f]=clone(si[f])});
      if(Array.isArray(si.checklist)){u.checklist=u.checklist||[];si.checklist.forEach(function(c){if(!u.checklist.some(function(x){return x.t===c.t}))u.checklist.push(clone(c))})}
    });
  });
  d.seedRev=SEED_DOC.seedRev;d.actualizado=SEED_DOC.actualizado;
  save();if(quiet)return;render();toast('Datos actualizados. Tus notas se conservaron.');
}
function delItem(sec,id){S.doc[sec]=S.doc[sec].filter(function(x){return x.id!==id});(S.doc.borrados=S.doc.borrados||[]).push(id)}

var pushT=null,pushing=false,dirty=false;
function key(){try{return sessionStorage.getItem('bk_k')||''}catch(e){return ''}}
function api(path,o){
  o=o||{};var h={'Authorization':'Bearer '+key()};
  if(o.body!=null)h['Content-Type']=o.ct||'application/json';
  return fetch('/api/admin/'+path,{method:o.method||'GET',headers:h,body:o.body,cache:'no-store'});
}
function adopt(j){
  S.cl.rev=j.rev;S.cl.at=j.updated;S.doc=j.doc;fillSeed();S.fresh=false;
  try{localStorage.setItem(LS,JSON.stringify(S.doc))}catch(e){}
}
async function cloudInit(){
  try{
    var r=await api('doc');
    if(r.status===503||r.status===401||r.status===429){S.cl.mode='local';S.cl.why=String(r.status);paintStat();return}
    if(!r.ok)throw new Error(r.status);
    var j=await r.json();
    S.cl.mode='cloud';S.cl.state='ok';
    if(!j.doc){S.cl.rev=j.rev||0;await push()}
    else adopt(j);
  }catch(e){S.cl.mode='local';S.cl.why='net'}
  render();
}
function schedule(){
  if(S.cl.mode!=='cloud')return;
  dirty=true;S.cl.state='pending';clearTimeout(pushT);pushT=setTimeout(push,1200);paintStat();
}
async function migrateImgs(){
  for(var sec in S.doc){
    var L=S.doc[sec];if(!Array.isArray(L))continue;
    for(var a=0;a<L.length;a++){
      var it=L[a];if(!it||!Array.isArray(it.imgs))continue;
      for(var i=0;i<it.imgs.length;i++){
        var u=it.imgs[i];if(typeof u!=='string'||u.indexOf('data:')!==0)continue;
        var id=uid(),r=await api('img/'+id,{method:'PUT',body:u,ct:'text/plain'});
        if(r.status===413||r.status===400)continue;
        if(!r.ok)throw new Error(r.status);
        IMGC['img:'+id]=u;it.imgs[i]='img:'+id;
      }
    }
  }
}
async function push(){
  if(pushing){clearTimeout(pushT);pushT=setTimeout(push,600);return}
  pushing=true;dirty=false;S.cl.state='saving';paintStat();
  try{
    await migrateImgs();
    var r=await api('doc',{method:'PUT',body:JSON.stringify({baseVersion:S.cl.rev,doc:S.doc})});
    if(r.status===409){var c=await r.json();pushing=false;conflict(c);return}
    if(!r.ok)throw new Error(r.status);
    var j=await r.json();S.cl.rev=j.rev;S.cl.at=j.updated;S.cl.state=dirty?'pending':'ok';
    try{localStorage.setItem(LS,JSON.stringify(S.doc))}catch(e){}
  }catch(e){S.cl.state='err';dirty=true;clearTimeout(pushT);pushT=setTimeout(push,8000)}
  pushing=false;paintStat();
}
function conflict(j){
  if(confirm('Hay cambios más nuevos en la nube (otro dispositivo).\n\nAceptar: cargar lo de la nube.\nCancelar: guardar lo que tengo aquí encima.')){adopt(j);S.cl.state='ok';render()}
  else{S.cl.rev=j.rev;push()}
}
async function refresh(){
  try{var r=await api('doc');if(!r.ok)return;var j=await r.json();if(j.doc&&j.rev!==S.cl.rev&&!dirty&&!pushing){adopt(j);render()}}catch(e){}
}
function paintStat(){
  var st=$('#stat');if(!st)return;var c=S.cl,t,warn=false;
  if(c.mode==='cloud'){
    t=c.state==='saving'?'Guardando…':c.state==='pending'?'Cambios sin guardar…':c.state==='err'?'Sin conexión, reintentando…':'Guardado en la nube · '+(c.at?ago(c.at):'ahora');
    warn=c.state==='err';
    st.innerHTML=esc(t)+' · <button data-act="hist">Historial</button>';
  }else{
    t=c.why==='net'?'Sin conexión con la nube · guardado solo en este navegador':'Guardado solo en este navegador';
    var kb=Math.round(size()/1024);if(kb>4000){t+=' · casi lleno ('+kb+' KB de ~5000)';warn=true}
    st.textContent=t;
  }
  st.className=warn?'warn':'';
}
async function showHist(){
  openMd('<h3>Historial</h3><p class="mut">Cargando…</p>');
  try{
    var r=await api('history');if(!r.ok)throw 0;var j=await r.json();
    var h='<h3>Historial</h3><p class="mut">Últimas versiones guardadas en la nube. Restaurar no borra nada: la versión actual también queda en el historial.</p><div class="list">';
    h+=j.versions.map(function(v){return '<div class="li"><div class="t"><b>'+new Date(v.updated).toLocaleString('es-MX',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'</b><span class="mut">versión '+v.rev+' · '+Math.round(v.size/1024)+' KB</span></div><button class="sm" data-act="restore" data-rev="'+v.rev+'">Restaurar</button></div>'}).join('')||'<div class="empty">Todavía no hay versiones anteriores.</div>';
    h+='</div><div class="row"><button class="ghost" data-act="close">Cerrar</button></div>';
    $('#md').innerHTML=h;
  }catch(e){$('#md').innerHTML='<h3>Historial</h3><p class="mut">No se pudo cargar.</p><div class="row"><button data-act="close">Cerrar</button></div>'}
}
async function restore(rev){
  if(!confirm('¿Restaurar la versión '+rev+'? Lo actual queda en el historial.'))return;
  try{
    var r=await api('restore',{method:'POST',body:JSON.stringify({rev:Number(rev)})});if(!r.ok)throw 0;
    var j=await r.json();adopt(j);S.cl.state='ok';closeMd();render();toast('Versión restaurada');
  }catch(e){toast('No se pudo restaurar')}
}

/* ---------- imágenes ---------- */
function iu(r){
  if(!r)return BLANK;
  if(r.indexOf('data:')===0)return r;
  if(IMGC[r])return IMGC[r];
  if(!IMGP[r]){IMGP[r]=1;api('img/'+r.slice(4)).then(function(x){return x.ok?x.text():''}).then(function(t){if(t){IMGC[r]=t;clearTimeout(iu.t);iu.t=setTimeout(function(){if(!$('#m_ok'))render()},200)}}).catch(function(){})}
  return BLANK;
}
function pimg(p,big){
  if(p.imgs&&p.imgs.length)return iu(p.imgs[0]);
  var m=MAPA[p.id];if(!m)return null;
  return (big&&m.big&&IMGS[m.big])||IMGS[m.img]||null;
}
function thumb(p,cls){
  var u=pimg(p);
  var tint=!u&&p.rareza&&RC[p.rareza]?' style="background:linear-gradient(135deg,color-mix(in srgb,'+RC[p.rareza]+' 18%,#fff),color-mix(in srgb,'+RC[p.rareza]+' 34%,#fff));color:color-mix(in srgb,'+RC[p.rareza]+' 85%,#000)"':'';
  return '<div'+tint+' class="th '+(cls||'')+(u?'':' ph')+'" data-l="'+esc((p.nombre||'?').charAt(0))+'">'+(u?'<img loading="lazy" alt="" src="'+u+'">':'')+'</div>';
}
function lightbox(u,l){var b=$('#lb');b.innerHTML='<img src="'+u+'" alt=""><span>'+esc(l||'')+' · toca para cerrar</span>';b.style.display='flex'}
function addImage(sec,id){S.imgT={sec:sec,id:id};$('#imgin').value='';$('#imgin').click()}
function onImg(f){
  if(!f||!S.imgT)return;
  var tgt=S.imgT,fr=new FileReader();
  fr.onload=function(){
    var im=new Image();
    im.onload=async function(){
      var cloud=S.cl.mode==='cloud',w=Math.min(cloud?1000:520,im.width),q=.82,lim=cloud?400*1024:150*1024,u;
      for(;;){
        var h=Math.round(im.height*w/im.width),c=document.createElement('canvas');c.width=w;c.height=h;
        var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
        u=c.toDataURL('image/jpeg',q);
        if(u.length<=lim||w<=240)break;
        if(q>.5)q-=.1;else w=Math.round(w*.8);
      }
      var it=find(tgt.sec,tgt.id);if(!it)return;
      var ref=u;
      if(cloud){
        var id=uid();
        try{var r=await api('img/'+id,{method:'PUT',body:u,ct:'text/plain'});if(!r.ok)throw 0;ref='img:'+id;IMGC[ref]=u}
        catch(e){toast('No se pudo subir la imagen');return}
      }
      (it.imgs=it.imgs||[]).push(ref);
      if(!save()){it.imgs.pop()}else toast('Imagen agregada ('+Math.round(u.length/1024)+' KB)');
      render();
    };
    im.onerror=function(){toast('No se pudo leer esa imagen')};
    im.src=fr.result;
  };
  fr.readAsDataURL(f);
}
function userImgs(it,sec){
  if(!it.imgs||!it.imgs.length)return '';
  return '<div class="gal">'+it.imgs.map(function(u,i){return '<span style="position:relative"><img src="'+iu(u)+'" alt="" data-act="lb" data-u="'+sec+'|'+it.id+'|'+i+'"><button class="sm dng" style="position:absolute;top:3px;right:3px;padding:0 7px;background:#fff" data-act="rmimg" data-sec="'+sec+'" data-id="'+it.id+'" data-i="'+i+'">×</button></span>'}).join('')+'</div>';
}

/* ---------- modales ---------- */
function openMd(h){$('#md').innerHTML=h;$('#ov').style.display='block';$('#ov').scrollTop=0;document.body.style.overflow='hidden'}
function closeMd(){$('#ov').style.display='none';document.body.style.overflow='';S.sheet=null}
function form(title,fields,vals,opts){
  opts=opts||{};
  return new Promise(function(res){
    var h='<h3>'+esc(title)+'</h3>';
    fields.forEach(function(f){
      if(f.t==='note'){h+='<p class="mut" style="margin:0 0 14px">'+esc(f.l)+'</p>';return}
      var v=vals[f.k],id='f_'+f.k;
      h+='<div class="f"><label>'+esc(f.l)+'</label>';
      if(f.t==='area')h+='<textarea id="'+id+'">'+esc(v)+'</textarea>';
      else if(f.t==='sel')h+='<select id="'+id+'">'+f.o.map(function(o){var ov=Array.isArray(o)?o[0]:o,ol=Array.isArray(o)?o[1]:o;return '<option value="'+esc(ov)+'"'+(ov===v?' selected':'')+'>'+esc(ol)+'</option>'}).join('')+'</select>';
      else if(f.t==='multi')h+='<div class="ml" id="'+id+'">'+f.o().map(function(o){return '<label><input type="checkbox" value="'+esc(o[0])+'"'+((v||[]).indexOf(o[0])>=0?' checked':'')+'>'+esc(o[1])+'</label>'}).join('')+'</div>';
      else h+='<input id="'+id+'" type="'+(f.t||'text')+'" value="'+esc(v)+'"'+(f.ro?' disabled':'')+(f.ph?' placeholder="'+esc(f.ph)+'"':'')+'>';
      h+='</div>';
    });
    h+='<div class="row"><button class="pri" id="m_ok">Guardar</button><button id="m_no">Cancelar</button>'+(opts.del?'<button class="dng" id="m_del" style="margin-left:auto">Borrar</button>':'')+'</div>';
    openMd(h);
    function close(r){if(!S.sheet){$('#ov').style.display='none';document.body.style.overflow=''}res(r)}
    $('#m_no').onclick=function(){close(null)};
    if(opts.del)$('#m_del').onclick=function(){if(confirm('¿Borrar?'))close('del')};
    $('#m_ok').onclick=function(){
      var o={};
      fields.forEach(function(f){
        if(f.t==='note')return;
        var e=$('#f_'+f.k);
        if(f.t==='multi')o[f.k]=[].map.call(e.querySelectorAll('input:checked'),function(i){return i.value});
        else if(f.t==='number'&&!f.raw)o[f.k]=Number(e.value)||0;

async function edit(sec,item,defaults){
  var c=F[sec],isNew=!item;
  var vals=item?Object.assign({},item):Object.assign({id:uid()},c.d,defaults||{});
  var r=await form((isNew?'Agregar ':'Editar ')+c.t,c.f,vals,{del:!isNew});
  var keep=S.sheet;
  if(!r){S.sheet=keep;render();return}
  var list=S.doc[sec];
  if(r==='del'){delItem(sec,vals.id);if(keep&&keep.id===vals.id)keep=null}

  S.sheet=keep;commit();
}

function calMes(){
  var C=S.cal,first=Date.UTC(C.y,C.m,1)/864e5,off=(new Date(first*864e5).getUTCDay()+6)%7,dim=new Date(Date.UTC(C.y,C.m+1,0)).getUTCDate();

function calLinea(){
  var L=S.doc.timeline.slice().sort(function(a,b){return dn(a.inicio)-dn(b.inicio)});
  if(!L.length)return '<div class="empty">Sin eventos</div>';
  var pd=S.cal.zoom,min=Math.min.apply(null,L.map(function(x){return dn(x.inicio)}))-10,t=dn(todayS());min=Math.min(min,t-10);
  var max=Math.max.apply(null,L.map(function(x){return dn(x.fin||x.inicio)}));
  var W=(max-min)*pd+320,H=40+L.length*36;
  var h='<div class="bar"><span class="mut">Acercar</span><button class="sm" data-act="zoom" data-d="-1">−</button><button class="sm" data-act="zoom" data-d="1">+</button><span class="mut">Desliza hacia los lados. La línea roja es hoy.</span></div>';
  h+='<div id="tl"><div id="tlin" style="width:'+W+'px;height:'+H+'px">';
  var d=new Date(min*864e5),y=d.getUTCFullYear(),m=d.getUTCMonth();m++;if(m>11){m=0;y++}
  while(true){
    var n=Date.UTC(y,m,1)/864e5;if(n>max+30)break;
    h+='<div class="mon'+(m===0?' y':'')+'" style="left:'+(n-min)*pd+'px">'+MES[m].slice(0,3)+(m===0||m===d.getUTCMonth()?' '+y:'')+'</div>';
    m++;if(m>11){m=0;y++}
  }
  L.forEach(function(x,i){
    var a=dn(x.inicio),b=dn(x.fin||x.inicio),left=(a-min)*pd,w=Math.max(16,(b-a+1)*pd),pt=a===b||x.fin==='';
    var est=x.tipo==='estreno',dot=pt&&!est;
    h+='<div class="tlr" style="top:'+(30+i*36)+'px;width:'+W+'px" data-act="tl" data-id="'+x.id+'"><div class="tlb'+(dot?' pt':'')+(x.estado==='idea'?' idea':'')+(est?' est':'')+'" style="left:'+left+'px;width:'+(dot?16:w)+'px"></div><div class="tll" style="left:'+(left+(dot?16:w)+8)+'px">'+esc(x.titulo)+'<small>'+whenOf(x)+'</small></div></div>';
  });
  h+='<div id="hoy" style="left:'+(t-min)*pd+'px"></div></div></div>';
  S.tlScroll=Math.max(0,(t-min)*pd-60);
  return h;
}

function filt(){

    if(f.tipo!=='Todos'&&grp(p.tipo)!==f.tipo)return false;

    {k:'activo',l:'Activo',t:'sel',o:[['true','Sí'],['false','No']]}
  ],v,{check:function(r){
    if(!/^[a-z0-9_]{2,40}$/.test(r.id))return 'Id: 2 a 40 caracteres, minúsculas, números o _';
    if(!r.nes)return 'Falta el nombre en español';
    var i=new Date(r.inicio),f=new Date(r.fin);
    if(isNaN(i)||isNaN(f))return 'Pon las fechas de inicio y fin';
    if(f<=i)return 'El fin debe ser después del inicio';
    if(!(r.objetivo>0))return 'El objetivo debe ser mayor que 0';
    if(!r.premios.length)return 'Elige al menos un premio';
    if(isNew&&rows('eventos').some(function(x){return x.id===r.id}))return 'Ya existe un evento con ese id';
  }}).then(function(r){
    if(!r)return;
    evSave({id:r.id,nombre:{es:r.nes,en:r.nen||r.nes},descripcion:{es:r.des,en:r.den||r.des},inicio:toIso(r.inicio),fin:toIso(r.fin),meta:r.meta,objetivo:Math.floor(r.objetivo),premios:r.premios,activo:r.activo==='true'},isNew?'Evento creado':'Evento guardado');
  });
}
function evSave(o,msg){rpc('admin_guardar_evento',{p_evento:o}).then(function(){toast(msg);rmReload('eventos');render()},function(e){toast(rerr(e))})}
/* acciones de las pestañas nuevas */
function act2(a,d){
  switch(a){
    case 'plv':S.plv=d.v;render();break;
    case 'rmre':rmReload(d.k);render();break;
    case 'ptog':{var o=pget(d.p),i=o.sel.indexOf(d.c);if(i<0)o.sel.push(d.c);else o.sel.splice(i,1);render();break}
    case 'plrm':{var p=prem(d.id);if(p){p.plan='';commit()}break}
    case 'gcrear':gCrear();break;
    case 'gclr':S.gen.sel=[];render();break;
    case 'gcopy':copyTxt(S.gen.out.map(function(c){return c.mostrar}).join('\n'),'Copiados '+S.gen.out.length);break;
    case 'crel':rmReload('codigos');render();break;
    case 'cmore':S.cf.lim+=100;render();break;
    case 'cexp':cExport();break;
    case 'cdtog':{var c=rows('codigos').find(function(x){return x.id===d.id});if(c)rpc('admin_editar_codigo',{p_id:c.id,p_cambios:{activo:!c.activo}}).then(function(){toast(c.activo?'Código desactivado':'Código activado');rmReload('codigos');render()},function(e){toast(rerr(e))});break}
    case 'cded':{var c2=rows('codigos').find(function(x){return x.id===d.id});if(c2)cEdit(c2);break}
    case 'cddel':{var c3=rows('codigos').find(function(x){return x.id===d.id});if(c3&&confirm('¿Borrar el código '+c3.mostrar+'? No tiene canjes.'))rpc('admin_borrar_codigo',{p_id:c3.id}).then(function(){toast('Código borrado');rmReload('codigos');render()},function(e){toast(rerr(e));rmReload('codigos');render()});break}
    case 'lrel':case 'drel':rmReload('avisos');rmReload('eventos');rmReload('codigos');render();break;
    case 'dclose':S.dropRes=null;render();break;
    case 'lanzar':lanzar();break;
    case 'avnew':avForm(null);break;
    case 'avedit':{var av=rows('avisos').find(function(x){return x.id===d.id});if(av)avForm(av);break}
    case 'avtog':{var av2=rows('avisos').find(function(x){return x.id===d.id});if(av2){var o2=Object.assign({},av2);o2.activo=!av2.activo;avSave(o2,o2.activo?'Aviso activado':'Aviso desactivado')}break}
    case 'avdel':{var av3=rows('avisos').find(function(x){return x.id===d.id});if(av3&&confirm('¿Borrar este aviso?'))rpc('admin_borrar_aviso',{p_id:av3.id}).then(function(){toast('Aviso borrado');rmReload('avisos');render()},function(e){toast(rerr(e))});break}
    case 'evnew':evForm(null);break;
    case 'evedit':{var ev=rows('eventos').find(function(x){return x.id===d.id});if(ev)evForm(ev);break}
    case 'evtog':{var ev2=rows('eventos').find(function(x){return x.id===d.id});if(ev2){var e2=Object.assign({},ev2);e2.activo=!ev2.activo;evSave(e2,e2.activo?'Evento activado':'Evento desactivado')}break}
    case 'evdel':{var ev3=rows('eventos').find(function(x){return x.id===d.id});if(ev3&&confirm('¿Borrar el evento '+ev3.id+'?'+((ev3.id==='muertos26'||ev3.id==='pionero')?' La app volverá a usar el suyo.':'')))rpc('admin_borrar_evento',{p_id:ev3.id}).then(function(){toast('Evento borrado');rmReload('eventos');render()},function(e){toast(rerr(e))});break}
  }
}

/* ---------- render ---------- */
var VIEWS={hoy:vHoy,cal:vCal,ver:vVer,prem:vPrem,plan:vPlan,cup:vCup,cod:vCods,live:vLive,pend:vPend,ideas:vIdeas};
function render(){
  if(S.doc&&needsUpdate())mergeSeed(true);
  var y=window.scrollY,pks=[].map.call(document.querySelectorAll('.pk'),function(e){return e.scrollTop});
  $('#nav').innerHTML=TABS.map(function(t){return '<button class="'+(S.tab===t[0]?'on':'')+'" data-act="goto" data-t="'+t[0]+'">'+t[1]+'</button>'}).join('');
  $('#app').innerHTML=VIEWS[S.tab]();
  [].forEach.call(document.querySelectorAll('.pk'),function(e,i){if(pks[i])e.scrollTop=pks[i]});
  paintStat();
  if(S.tab==='cal'&&S.cal.view==='linea'&&S.tlScroll!=null){var e=$('#tl');if(e){e.scrollLeft=S.keepScroll!=null?S.keepScroll:S.tlScroll;S.keepScroll=null}}
  [['#pq','pf'],['#cq','cq']].forEach(function(x){
    var el=$(x[0]);if(!el)return;
    el.oninput=function(){var p=el.selectionStart;if(x[1]==='pf')S.pf.q=el.value;else S.cq=el.value;render();var n=$(x[0]);n.focus();n.setSelectionRange(p,p)};
  });
  if(S.sheet){var it=find(S.sheet.sec,S.sheet.id);if(it){openMd(S.sheet.sec==='premios'?sheetPrem(it):sheetTl(it));$('#ov').scrollTop=S.sheet.sc||0}else closeMd()}
  window.scrollTo(0,y);
}
function sheet(sec,id){S.sheet={sec:sec,id:id};render()}
function goto(t){S.tab=t;try{localStorage.setItem('bk_tab',t)}catch(e){}closeMd();render();window.scrollTo(0,0)}
function exportDoc(){
  var d=clone(S.doc);
  Object.keys(d).forEach(function(k){if(Array.isArray(d[k]))d[k].forEach(function(it){if(it&&Array.isArray(it.imgs))it.imgs=it.imgs.map(function(r){return IMGC[r]||r})})});
  var b=new Blob([JSON.stringify(d,null,1)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='blokku-panel-'+todayS()+'.json';l.click();setTimeout(function(){URL.revokeObjectURL(u)},3000);
}

document.addEventListener('click',function(ev){
  if(!ev.target.closest('[data-act="menu"]')&&$('#menu').style.display==='block')$('#menu').style.display='none';
  if(ev.target.id==='ov'){closeMd();return}
  if(ev.target.closest('#lb')){$('#lb').style.display='none';return}
  var el=ev.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,d=el.dataset;
  if(a==='tgk'||a==='tgc'||a==='pfs'||a==='cest'||a==='cnote'||a==='csolo'||a==='plset')return; /* se manejan en change */
  switch(a){
    case 'menu':{var m=$('#menu');m.style.display=m.style.display==='block'?'none':'block';break}
    case 'hist':showHist();break;
    case 'restore':restore(d.rev);break;
    case 'goto':if(d.q)S.pq=d.q;goto(d.t);break;
    case 'close':closeMd();render();break;
    case 'export':exportDoc();break;
    case 'import':$('#file').value='';$('#file').click();break;
    case 'logout':sessionStorage.removeItem('bk_k');location.reload();break;
    case 'merge':mergeSeed();break;
    case 'cview':S.cal.view=d.v;render();break;
    case 'cmv':{var n=Number(d.d);if(!n){var t=new Date();S.cal.y=t.getFullYear();S.cal.m=t.getMonth();S.cal.sel=todayS()}else{S.cal.m+=n;if(S.cal.m<0){S.cal.m=11;S.cal.y--}if(S.cal.m>11){S.cal.m=0;S.cal.y++}}render();break}
    case 'day':S.cal.sel=d.d;{var dt=new Date(dn(d.d)*864e5);S.cal.y=dt.getUTCFullYear();S.cal.m=dt.getUTCMonth()}render();break;
    case 'zoom':{var e=$('#tl');S.keepScroll=e?e.scrollLeft:null;S.cal.zoom=Math.max(2,Math.min(16,S.cal.zoom+Number(d.d)*2));render();break}
    case 'tl':sheet('timeline',d.id);break;
    case 'prem':if(prem(d.id))sheet('premios',d.id);break;
    case 'pv':S.pv=d.v;render();break;
    case 'pq':S.pq=d.v;render();break;
    case 'tgdone':S.open.done=!S.open.done;render();break;
    case 'add':edit(d.sec,null,d.ini?{inicio:d.ini}:null);break;
    case 'edit':{var it=find(d.sec,d.id);if(it){if(S.sheet)S.sheet.sc=$('#ov').scrollTop;edit(d.sec,it)}break}
    case 'pend':edit('pendientes',find('pendientes',d.id));break;
    case 'vote':{var i=find('ideas',d.id);i.votos=(i.votos||0)+1;commit();break}
    case 'copy':try{navigator.clipboard.writeText(d.t);toast('Copiado: '+d.t)}catch(e){toast(d.t)}break;
    case 'cgrp':S.open['c_'+d.id]=!S.open['c_'+d.id];render();break;
    case 'creveal':S.reveal[d.h]=!S.reveal[d.h];render();break;
    case 'ccopy':{var cc=CODES.find(function(c){return c.h===d.h});try{navigator.clipboard.writeText(cc.c);toast('Código copiado')}catch(e){toast('No se pudo copiar; usa «ver»')}break}
    case 'addimg':addImage(d.sec,d.id);break;
    case 'rmimg':{if(confirm('¿Quitar esta imagen?')){var it2=find(d.sec,d.id);it2.imgs.splice(Number(d.i),1);commit()}break}
    case 'lbk':if(d.u){var q=d.u.split('|');lightbox(iu(find(q[0],q[1]).imgs[q[2]]),d.l)}else if(IMGS[d.k])lightbox(IMGS[d.k],d.l);break;
    case 'lb':{var q2=d.u.split('|');lightbox(iu(find(q2[0],q2[1]).imgs[q2[2]]),'');break}
    default:act2(a,d);break;
    case 'addck':{var v=find('versiones',d.id),t2=prompt('Nuevo punto de la checklist');if(t2&&t2.trim()){(v.checklist=v.checklist||[]).push({t:t2.trim(),d:false});commit()}break}
  }
});
document.addEventListener('change',function(ev){
  var el=ev.target.closest('[data-act]');
  if(el){
    var a=el.dataset.act;
    if(a==='tgk'){var k=find('pendientes',el.dataset.id);k.col=el.checked?'hecho':'todo';commit()}
    if(a==='tgc'){var v=find('versiones',el.dataset.id);v.checklist[Number(el.dataset.i)].d=el.checked;commit()}
    if(a==='pfs'){S.pf[el.dataset.k]=el.value;render()}
    if(a==='cest')setCode(el.dataset.h,'e',el.value);
    if(a==='cnote')setCode(el.dataset.h,'n',el.value.trim());
    if(a==='csolo'){S.csolo=el.checked;render()}
    if(a==='plset'&&el.value){var pp=prem(el.value);if(pp){pp.plan=el.dataset.v;commit()}}
  }
  if(ev.target.id==='file'){
    var f=ev.target.files[0];if(!f)return;
    var fr=new FileReader();fr.onload=function(){
      try{var j=JSON.parse(fr.result);if(!j||!Array.isArray(j.timeline))throw 0;
        if(!confirm('Esto reemplaza los datos guardados por los del archivo. ¿Seguir?'))return;
        S.doc=j;fillSeed();commit();toast('Importado')}
      catch(e){toast('Ese archivo no es un respaldo del panel')}
    };fr.readAsText(f);
  }
  if(ev.target.id==='imgin')onImg(ev.target.files[0]);
});
document.addEventListener('input',function(ev){
  var el=ev.target,b=el.dataset&&el.dataset.bind;if(!b)return;
  pset(b,el.type==='checkbox'?el.checked:el.value);
  if(el.dataset.rr){var id=el.id,p=el.selectionStart;render();var n=id&&document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(p,p)}catch(e){}}}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){$('#lb').style.display='none';closeMd();render()}});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&S.cl.mode==='cloud'&&$('#ov').style.display!=='block')refresh()});
window.addEventListener('error',function(e){var t=$('#toast');if(t){t.textContent='Error: '+e.message;t.style.display='block'}});
setInterval(paintStat,30000);
if(IMGS.icono)$('#lg').src=IMGS.icono;
load();render();cloudInit();
})();
</script></body></html>
